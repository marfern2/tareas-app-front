name: android-ci

on:
  pull_request:
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests, lint and compile both environments
        run: ./gradlew testDevDebugUnitTest testProdDebugUnitTest lintDevDebug lintProdDebug assembleDevDebug assembleProdDebug --console=plain

  package-development:
    if: github.ref == 'refs/heads/develop'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
    concurrency:
      group: android-development
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assembleDevDebug --console=plain
      - name: Upload DEV APK
        uses: actions/upload-artifact@v4
        with:
          name: donit-dev-${{ github.sha }}
          path: app/build/outputs/apk/dev/debug/*.apk
          retention-days: 14

  package-production:
    if: github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: android-production
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Restore release keystore outside repository
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/donit-release.jks"
          chmod 600 "$RUNNER_TEMP/donit-release.jks"
      - name: Build signed PROD APK
        env:
          DONIT_RELEASE_STORE_FILE: ${{ runner.temp }}/donit-release.jks
          DONIT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          DONIT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DONIT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleProdRelease --console=plain
      - name: Upload signed PROD artifact
        uses: actions/upload-artifact@v4
        with:
          name: donit-prod-signed-${{ github.sha }}
          path: app/build/outputs/apk/prod/release/app-prod-release.apk
          retention-days: 14
