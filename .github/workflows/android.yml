name: android-ci

on:
  pull_request:
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests, lint and compile both environments
        run: ./gradlew testDevDebugUnitTest testProdDebugUnitTest lintDevDebug lintProdDebug assembleDevDebug assembleProdDebug --console=plain
      - name: Build unsigned PROD release
        if: github.ref == 'refs/heads/master'
        run: ./gradlew assembleProdRelease --console=plain
      - name: Upload DEV APK
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: donit-dev-${{ github.sha }}
          path: app/build/outputs/apk/dev/debug/*.apk
          retention-days: 14
      - name: Upload unsigned PROD artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: donit-prod-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/prod/release/*.apk
          retention-days: 14
